name: Thread-Safety Guardrails

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "memris-core/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/thread-safety.yml"

permissions:
  contents: read

jobs:
  concurrency-codegen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run forked parallel thread-safety suite
        run: bash ./gradlew :memris-core:threadSafetyTest
