name: Perf Guardrails

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "memris-core/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "scripts/check-jmh-regression.py"
      - ".github/workflows/perf.yml"

permissions:
  contents: read

jobs:
  jmh-embedded-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run embedded path benchmark subset
        run: bash ./gradlew :memris-core:jmh -PjmhResult=reports/jmh/embedded-attempt1.json

      - name: Check throughput regressions (retry once on failure)
        run: |
          run_check() {
            python3 scripts/check-jmh-regression.py \
              --baseline memris-core/src/jmh/resources/embedded-path-baseline.json \
              --current "$1" \
              --flat-threshold 0.10 \
              --embedded-threshold 0.15
          }

          if run_check memris-core/build/reports/jmh/embedded-attempt1.json; then
            exit 0
          fi

          echo "Re-running JMH once to filter transient host noise."
          bash ./gradlew :memris-core:jmh -PjmhResult=reports/jmh/embedded-attempt2.json
          run_check memris-core/build/reports/jmh/embedded-attempt2.json

      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-embedded-results
          path: memris-core/build/reports/jmh/embedded-*.json
