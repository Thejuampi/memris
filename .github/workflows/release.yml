name: Release to Maven Central

on:
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Compute release versions
        id: versions
        run: python3 scripts/release.py versions

      - name: Check release coordinates and notes
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: |
          if git rev-parse --verify "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists"
            exit 1
          fi
          python3 scripts/release.py check-available --version "$RELEASE_VERSION"
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check-docs-drift.py

      - name: Package and test the release
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: bash ./gradlew assemble test "-Pversion=$RELEASE_VERSION"

      - name: Verify packaged consumers before publication
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: |
          bash ./gradlew publishAllPublicationsToBuildRepository "-Pversion=$RELEASE_VERSION"
          python3 scripts/release.py verify-artifacts --version "$RELEASE_VERSION"
          bash ./gradlew -p verification/consumers verifyConsumers "-PmemrisVersion=$RELEASE_VERSION" "-PmemrisRepository=$GITHUB_WORKSPACE/build/repository" --refresh-dependencies --no-configuration-cache
          bash ./gradlew -p verification/consumers verifyConsumers "-PmemrisVersion=$RELEASE_VERSION" "-PmemrisRepository=$GITHUB_WORKSPACE/build/repository" -PpomOnly --refresh-dependencies --no-configuration-cache

      - name: Publish signed artifacts to Maven Central
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          ORG_GRADLE_PROJECT_mavenCentralPublishing: "true"
          ORG_GRADLE_PROJECT_signAllPublications: "true"
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: bash ./gradlew publishAndReleaseToMavenCentral "-Pversion=$RELEASE_VERSION" --no-configuration-cache

      - name: Record release and next snapshot
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          DEVELOPMENT_VERSION: ${{ steps.versions.outputs.development_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py record-release --version "$RELEASE_VERSION"
          python3 scripts/check-docs-drift.py
          git add gradle.properties README.md docs
          git commit -m "release: prepare release v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          python3 scripts/release.py record-development --version "$DEVELOPMENT_VERSION"
          python3 scripts/check-docs-drift.py
          git add gradle.properties README.md docs
          git commit -m "chore: bump to $DEVELOPMENT_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: gh release create "v$RELEASE_VERSION" --verify-tag --title "Memris $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
