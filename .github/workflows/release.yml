name: Release to Maven Central

on:
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Compute release versions
        id: versions
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          properties = pathlib.Path('gradle.properties').read_text(encoding='utf-8')
          match = re.search(r'^version=(\d+)\.(\d+)\.(\d+)-SNAPSHOT$', properties, re.MULTILINE)
          if match is None:
              raise SystemExit('Expected a major.minor.patch-SNAPSHOT version in gradle.properties')
          major, minor, patch = map(int, match.groups())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'release_version={major}.{minor}.{patch}\n')
              output.write(f'development_version={major}.{minor}.{patch + 1}-SNAPSHOT\n')
          PY

      - name: Package and test the release
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: bash ./gradlew assemble test "-Pversion=$RELEASE_VERSION"

      - name: Publish signed artifacts to Maven Central
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          ORG_GRADLE_PROJECT_mavenCentralPublishing: "true"
          ORG_GRADLE_PROJECT_signAllPublications: "true"
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: bash ./gradlew publishAndReleaseToMavenCentral "-Pversion=$RELEASE_VERSION" --no-configuration-cache

      - name: Record release and next snapshot
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          DEVELOPMENT_VERSION: ${{ steps.versions.outputs.development_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          path = pathlib.Path('gradle.properties')
          path.write_text(re.sub(r'^version=.*$', 'version=' + os.environ['RELEASE_VERSION'], path.read_text(), flags=re.MULTILINE))
          PY
          git add gradle.properties
          git commit -m "release: prepare release v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          path = pathlib.Path('gradle.properties')
          path.write_text(re.sub(r'^version=.*$', 'version=' + os.environ['DEVELOPMENT_VERSION'], path.read_text(), flags=re.MULTILINE))
          PY
          git add gradle.properties
          git commit -m "chore: bump to $DEVELOPMENT_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"
