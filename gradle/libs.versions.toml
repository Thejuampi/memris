spring-data2-commons = { module = "org.springframework.data:spring-data-commons", version.ref = "spring-data2" }
spring-data3-commons = { module = "org.springframework.data:spring-data-commons", version.ref = "spring-data3" }
spring5-context = { module = "org.springframework:spring-context", version.ref = "spring5" }
spring6-context = { module = "org.springframework:spring-context", version.ref = "spring6" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
